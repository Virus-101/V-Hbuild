name: Desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write     # the release job publishes the installers to the tag's release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-desktop.txt pytest httpx
      - run: pytest -q
      - run: pyinstaller packaging/vhbuild-desktop.spec --noconfirm
      - name: Smoke-test the bundle
        shell: pwsh
        run: |
          $p = Start-Process dist\V-Hbuild\V-Hbuild.exe -ArgumentList "--browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            try { $s = Invoke-RestMethod http://127.0.0.1:8799/api/status; if ($s.desktop) { $ok = $true; break } } catch {}
            Start-Sleep -Milliseconds 500
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "V-Hbuild.exe did not start its server" }
      - name: Build the installer
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.release_tag }}" }
          $version = if ($tag) { $tag.TrimStart("v") } else { "0.0.${{ github.run_number }}" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\vhbuild.iss
      - uses: actions/upload-artifact@v4
        with:
          name: V-HbuildSetup-windows
          path: dist/V-HbuildSetup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-desktop.txt
      - run: pyinstaller packaging/vhbuild-desktop.spec --noconfirm
      - run: cd dist && zip -qr V-Hbuild-macos.zip V-Hbuild
      - uses: actions/upload-artifact@v4
        with:
          name: V-Hbuild-macos
          path: dist/V-Hbuild-macos.zip

  release:
    # On a v* tag - or a manual run given a release_tag - publish both builds
    # as a GitHub Release. For a manual run the tag is created on this commit.
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: V-Hbuild ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/V-HbuildSetup-*.exe
            dist/V-Hbuild-macos.zip
