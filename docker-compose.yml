# The V-Hbuild platform: the web app, and a local model served by Ollama next to it.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b   # once; or your own model, see models/README.md
#   open http://localhost:8780
services:
  vhbuild:
    build: .
    ports: ["8780:8780"]
    environment:
      VHBUILD_OLLAMA_URL: http://ollama:11434
      VHBUILD_LOCAL_MODEL: llama3.2:3b
      VHBUILD_MAX_JOBS: "2"
      # ANTHROPIC_API_KEY: ...           # optional second model
    volumes:
      - platformio:/home/vhbuild/.platformio
    depends_on: [ollama]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
      - ./models:/models:ro             # optional: your own GGUF and Modelfile
    restart: unless-stopped
    # With an NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  platformio:
  ollama:
